[project]
name = "ralph"
version = "0.1.0"
description = "Harnessed engineering for coding agents"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
ralph = "ralph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ralph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `TestRunner` is a port, not a test class. Nothing here uses class-based tests.
python_classes = []

[tool.mypy]
strict = true
# `tests` is in scope deliberately: the assertion that each fake structurally satisfies its
# Protocol is an annotation in tests/test_contract.py, and only mypy can check it. Runtime
# isinstance on a Protocol compares method names, not signatures.
files = ["ralph", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
